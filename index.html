<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Roboto',sans-serif;
}

body{
  background:#f2f3f5;
  display:flex;
  justify-content:center;
}

.mobile{
  width:100%;
  max-width:420px;
  min-height:100vh;
  padding:20px;
}

/* Header */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:40px;
  font-size:18px;
  font-weight:500;
}

.profile{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#1a73e8;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

/* Logo */
.logo{
  text-align:center;
  font-size:32px;
  margin-bottom:15px;
}

.logo span:nth-child(1){color:#4285F4;}
.logo span:nth-child(2){color:#DB4437;}
.logo span:nth-child(3){color:#F4B400;}
.logo span:nth-child(4){color:#4285F4;}
.logo span:nth-child(5){color:#0F9D58;}
.logo span:nth-child(6){color:#DB4437;}

h2{
  text-align:center;
  font-weight:400;
  font-size:26px;
  margin-bottom:12px;
}

/* Email chip */
.email{
  background:white;
  border-radius:22px;
  padding:7px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
  margin-bottom:25px;
  font-size:13px;
  width:fit-content;
  margin-left:auto;
  margin-right:auto;
}

.email-circle{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#1a73e8;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* Instruction */
.text{
  margin-bottom:10px;
  color:#444;
  font-size:15px;
}

/* Password box */
input{
  width:100%;
  padding:14px;
  border:2px solid #1a73e8;
  border-radius:6px;
  font-size:16px;
  margin-bottom:18px;
}

/* Checkbox */
.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:30px;
  font-size:14px;
}

/* Bottom actions */
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.actions a{
  color:#1a73e8;
  text-decoration:none;
  font-size:14px;
}

button{
  background:#1a73e8;
  border:none;
  color:white;
  padding:10px 22px;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
}

button:hover{
  background:#1558b0;
}
</style>
</head>

<body>

<div class="mobile">

  <div class="header">
    ←
    <div>Account Center</div>
    <div class="profile">B</div>
  </div>

  <div class="logo">
    <span>S</span><span>u</span><span>h</span><span>a</span><span>i</span><span>l</span>
  </div>

  <h2>Hi Bushra Naaz</h2>

  <div class="email">
    <div class="email-circle">B</div>
    bushraaa354@email.com
  </div>

  <div class="text">To continue, first verify it’s you</div>

  <input type="password" id="pass" placeholder="Enter your password">

  <div class="checkbox">
    <input type="checkbox" id="toggle">
    Show password
  </div>

  <div class="actions">
    <a href="#">Forgot password?</a>
    <button>Confirm</button>
  </div>

</div>

<script>
document.getElementById("toggle").addEventListener("change", function(){
  const p = document.getElementById("pass");
  p.type = this.checked ? "text" : "password";
});
</script>

</body>
</html>
