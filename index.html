<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Roboto',sans-serif;
}

body{
  background:#f2f3f5;
  display:flex;
  justify-content:center;
}

.mobile{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:#f2f3f5;
  padding:20px;
}

/* Header */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:50px;
  font-size:18px;
  font-weight:500;
}

.circle{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#1a73e8;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:500;
}

/* Logo */
.logo{
  text-align:center;
  font-size:34px;
  margin-bottom:20px;
}

.logo span:nth-child(1){color:#4285F4;}
.logo span:nth-child(2){color:#DB4437;}
.logo span:nth-child(3){color:#F4B400;}
.logo span:nth-child(4){color:#4285F4;}
.logo span:nth-child(5){color:#0F9D58;}
.logo span:nth-child(6){color:#DB4437;}

h2{
  text-align:center;
  font-weight:400;
  margin-bottom:20px;
}

/* Email Chip */
.email{
  background:white;
  border-radius:30px;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
  margin-bottom:40px;
}

.email span{
  font-size:14px;
}

/* Instruction */
.text{
  margin-bottom:10px;
  color:#444;
}

/* Input underline style */
.input-group{
  position:relative;
  margin-bottom:25px;
}

input{
  width:100%;
  border:none;
  border-bottom:2px solid #c4c4c4;
  padding:10px 0;
  font-size:16px;
  background:transparent;
}

input:focus{
  outline:none;
  border-bottom:2px solid #1a73e8;
}

/* Checkbox */
.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:35px;
  font-size:14px;
}

/* Actions */
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.actions a{
  color:#1a73e8;
  text-decoration:none;
  font-size:14px;
}

button{
  background:#1a73e8;
  border:none;
  color:white;
  padding:10px 22px;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
}

button:hover{
  background:#1558b0;
}
</style>
</head>

<body>

<div class="mobile">

  <div class="header">
    ←
    <div>Secure Portal</div>
    <div class="circle">B</div>
  </div>

  <div class="logo">
    <span>S</span><span>u</span><span>h</span><span>a</span><span>i</span><span>l</span>
  </div>

  <h2>Hi Bushra Naaz</h2>

  <div class="email">
    <div class="circle" style="width:28px;height:28px;font-size:13px;">B</div>
    <span>bushraaa354@email.com</span>
  </div>

  <div class="text">To continue, verify your access</div>

  <div class="input-group">
    <input type="password" id="pass" placeholder="Enter your password">
  </div>

  <div class="checkbox">
    <input type="checkbox" id="toggle">
    Show password
  </div>

  <div class="actions">
    <a href="#">Forgot password?</a>
    <button>Confirm</button>
  </div>

</div>

<script>
document.getElementById("toggle").addEventListener("change", function(){
  const p = document.getElementById("pass");
  p.type = this.checked ? "text" : "password";
});
</script>

</body>
</html>
