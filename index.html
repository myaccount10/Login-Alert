<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Login UI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4e73df,#1cc88a);
}

.card{
  width:100%;
  max-width:360px;
  background:white;
  padding:35px 25px;
  border-radius:16px;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.card h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
  color:#333;
}

.input-group{
  margin-bottom:20px;
}

.input-group label{
  font-size:13px;
  color:#555;
  display:block;
  margin-bottom:6px;
}

.input-group input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
  outline:none;
  transition:0.2s;
}

.input-group input:focus{
  border-color:#4e73df;
}

button{
  width:100%;
  padding:12px;
  background:#4e73df;
  border:none;
  color:white;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  background:#2e59d9;
}

.footer{
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <h2>Demo Login</h2>

  <div class="input-group">
    <label>Email Address</label>
    <input type="email" placeholder="Enter your email">
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" placeholder="Enter password">
  </div>

  <button>Login</button>

  <div class="footer">
    This is a demo UI for learning web development.
  </div>
</div>

</body>
</html>
