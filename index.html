<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Center</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Roboto',sans-serif;
}

body{
  background:#f2f3f5;
  display:flex;
  justify-content:center;
}

.mobile{
  width:100%;
  max-width:420px;
  min-height:100vh;
  padding:20px;
}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
  font-size:18px;
  font-weight:500;
}

.profile{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#1a73e8;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

/* Title */
h2{
  margin-bottom:15px;
  font-weight:400;
  font-size:20px;
}

/* Password input */
input[type="password"]{
  width:100%;
  padding:14px;
  border:1px solid #dadce0;
  border-radius:6px;
  font-size:16px;
  outline:none;
  transition:0.2s;
  margin-bottom:20px;
}

/* Blue border on focus */
input[type="password"]:focus{
  border:2px solid #1a73e8;
}

/* Checkbox row */
.checkbox-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:30px;
  font-size:14px;
}

.checkbox-row input{
  width:18px;
  height:18px;
}

/* Bottom actions */
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.actions a{
  color:#1a73e8;
  text-decoration:none;
  font-size:14px;
}

button{
  background:#1a73e8;
  border:none;
  color:white;
  padding:10px 22px;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
}

button:hover{
  background:#1558b0;
}
</style>
</head>

<body>

<div class="mobile">

  <div class="header">
    ←
    <div>Account Center</div>
    <div class="profile">B</div>
  </div>

  <h2>To continue, first verify it’s you</h2>

  <input type="password" id="pass" placeholder="Enter your password">

  <div class="checkbox-row">
    <input type="checkbox" id="toggle">
    <label for="toggle">Show password</label>
  </div>

  <div class="actions">
    <a href="#">Forgot password?</a>
    <button>Confirm</button>
  </div>

</div>

<script>
document.getElementById("toggle").addEventListener("change", function(){
  const p = document.getElementById("pass");
  p.type = this.checked ? "text" : "password";
});
</script>

</body>
</html>
